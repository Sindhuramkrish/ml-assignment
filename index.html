<!DOCTYPE html>
<html>
<head>
    <title>Epsilon Greedy Bandit</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        h2 {
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>🎰 Epsilon-Greedy Bandit</h2>

        <button onclick="nextStep()">
            Next Step
        </button>

        <button onclick="resetData()">
            Reset
        </button>

        <hr>

        <p><b>Selected Arm:</b> <span id="action">-</span></p>

        <p><b>Reward:</b> <span id="reward">-</span></p>

        <p><b>Average Reward:</b> <span id="avg">-</span></p>

    </div>

    <script>

        async function nextStep() {

            const response = await fetch('/step');

            const data = await response.json();

            document.getElementById('action').innerText = data.action;

            document.getElementById('reward').innerText = data.reward;

            document.getElementById('avg').innerText = data.avg_reward;
        }

        async function resetData() {

            await fetch('/reset');

            document.getElementById('action').innerText = '-';

            document.getElementById('reward').innerText = '-';

            document.getElementById('avg').innerText = '-';
        }

    </script>

</body>
</html>
